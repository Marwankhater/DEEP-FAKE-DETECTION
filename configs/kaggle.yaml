# Used by notebooks/02_train_on_kaggle.ipynb with the DFDC competition data attached.

data:
  videos_dirs:
    - /kaggle/input/deepfake-detection-challenge/train_sample_videos
  faces_dir: /kaggle/working/faces
  frames_per_video: 16
  face_margin: 0.25
  min_face_confidence: 0.90
  image_size: 224

split:
  val_fraction: 0.15
  test_fraction: 0.15
  seed: 42

train:
  batch_size: 32
  epochs_head: 3
  epochs_finetune: 12
  lr_head: 0.001
  lr_finetune: 0.0001
  unfreeze_from: block6a_expand_conv
  dropout: 0.3
  weights: imagenet
  patience: 4

run_dir: /kaggle/working/runs/efficientnet_b0
